# ==============================================================================
# REALISTIC LIFE FINANCIAL PLAN TEMPLATE
# ==============================================================================
# This template models the complete financial life of a 30-year-old working
# professional (e.g. software engineer, product manager, or analyst).
#
# Profile & Life State:
# - Annual Base Salary: $115,000 with 3.5% annual merit raise + 8% annual bonus
# - Pre-tax Benefits: 6% Traditional 401(k) with 100% employer match up to 6%
# - HSA: $100/period with $500 annual employer seed contribution
# - Initial Starting Assets:
#     * Checking: $4,000 (operational liquidity)
#     * HYSA: $18,000 (high-yield emergency fund @ 4.5% APY)
#     * Roth IRA: $12,000 (invested in broad index funds @ 8.0% return)
#     * Traditional 401(k): $35,000 (invested @ 8.0% return)
#     * Taxable Brokerage: $10,000 (invested @ 8.5% return with 1.5% dividends)
# - Initial Starting Liabilities:
#     * Rewards Credit Card: $0 balance (2% flat cashback, 4% dining, full autopay)
#     * Student Loan: $14,000 remaining @ 5.5% APR (5-year remaining term)
# - Living Expenses:
#     * Rent: $1,950/mo with 3.5% anniversary renewal escalation
#     * Utilities: Electric (seasonal), gas, water, gigabit fiber internet, mobile phone
#     * Food: Weekly groceries using estimator + dining out on weekends
#     * Transport: Gas estimator, 6-month car insurance, maintenance sinking fund
#     * Lifestyle & Subscriptions: Streaming, gym, holidays, summer vacation
# - Cashflow Automation:
#     * Overdraft coverage from HYSA
#     * Payday skim into Roth IRA ($500/mo) with brokerage overflow
#     * Debt payoff: extra $250/mo accelerating student loan payoff
#     * Month-end checking sweep: cash > $4,500 swept into taxable brokerage
# - Goals:
#     * Pay off student debt
#     * Hit $250,000 net worth
#     * Reach Coast FIRE status for early retirement
#
# Feel free to copy this file, tweak the numbers to match your real life,
# and run: uv run lifesim scenarios/realistic_life_template.yaml
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. SIMULATION HORIZON & SETTINGS
# ------------------------------------------------------------------------------
start: 2026-01-01
end: 2030-12-31       # 5-year financial projection
seed: 42              # Deterministic reproducibility

# ------------------------------------------------------------------------------
# 2. ACCOUNTS & BALANCES
# ------------------------------------------------------------------------------
accounts:
  # Primary checking account for receiving net salary and paying monthly bills
  checking:
    kind: checking
    balance: 4000.0
    overdraft_limit: 500.0
    overdraft_fee: 35.0

  # High-Yield Savings Account (Emergency Fund earning 4.5% APY, credited monthly)
  hysa:
    kind: hysa
    balance: 18000.0
    apy: 0.045
    interest_posting: monthly

  # Pre-tax 401(k) holding employer match and employee contributions
  traditional_401k:
    kind: traditional_401k
    balance: 35000.0
    expected_return: 0.080
    volatility: 0.150
    expense_ratio: 0.0004

  # Tax-free Roth IRA for retirement growth
  roth_ira:
    kind: roth_ira
    balance: 12000.0
    expected_return: 0.080
    volatility: 0.150
    annual_contribution_limit: 7000.0

  # Taxable investment brokerage for medium/long-term wealth building
  brokerage:
    kind: investment
    balance: 10000.0
    expected_return: 0.085
    volatility: 0.160
    expense_ratio: 0.0003
    dividend_yield: 0.015
    drip: true

  # Health Savings Account for triple tax-advantaged health savings & investing
  hsa:
    kind: hsa
    balance: 3500.0
    expected_return: 0.075

  # Everyday cashback credit card (paid automatically in full every month)
  credit_card:
    kind: credit_card
    balance: 0.0
    apr: 0.2299
    credit_limit: 15000.0
    statement_day: 25
    due_day: 20
    cashback_pct: 0.02
    category_cashback:
      dining: 0.04
      groceries: 0.03
    autopay:
      enabled: true
      from_account: checking
      mode: statement_balance

  # Remaining student loan debt being actively paid down
  student_loan:
    kind: student_loan
    principal: 14000.0
    apr: 0.055
    term_months: 60
    payment_day: 15
    payment_from_account: checking
    extra_monthly_principal: 100.0

# ------------------------------------------------------------------------------
# 3. PAYCHECKS & EMPLOYMENT INCOME
# ------------------------------------------------------------------------------
paychecks:
  - name: "Primary Career Job"
    enabled: true
    schedule:
      biweekly: fri
      anchor: 2026-01-02
      weekend_rule: before
      respect_us_holidays: true
    annual_salary: 115000.0
    annual_raise_pct: 0.035          # 3.5% merit raise every March 1
    raise_month: 3
    raise_day: 1

    # Annual target performance bonus
    bonuses:
      - name: "Annual Performance Bonus"
        enabled: true
        schedule: {yearly: {month: 3, day: 15}}
        target_pct_of_salary: 0.08
        multiplier: {normal: [1.0, 0.10], min_amount: 0.5, max_amount: 1.5}
        supplemental_federal_rate: 0.22
        apply_401k: true

    # Pre-tax medical, dental, vision insurance premiums per paycheck
    pretax_deductions_per_period: 120.0

    # 401(k) Retirement Plan with 100% dollar-for-dollar employer match
    retirement_401k:
      enabled: true
      traditional_pct: 0.06          # 6% pre-tax employee contribution
      traditional_account: traditional_401k
      employer_match:
        enabled: true
        match_rate: 1.0              # 100% match
        up_to_pct: 0.06              # on first 6% of gross pay
        annual_true_up: true
        to_account: traditional_401k

    # Health Savings Account (HSA) contributions
    hsa:
      enabled: true
      to_account: hsa
      employee_per_period: 100.0
      employer_annual_seed: 500.0    # Company seeds $500 on first paycheck of year

    # Tax withholding settings
    withholding:
      mode: brackets
      effective_state_rate: 0.045
      include_fica: true

    # Direct deposit routing: route net pay directly to checking
    direct_deposit:
      - to: checking
        remainder: true

    tags: [salary, payday]

# ------------------------------------------------------------------------------
# 4. LIVING EXPENSES & CASHFLOWS
# ------------------------------------------------------------------------------
flows:
  # --- Housing & Shelter ---
  - name: "Apartment Rent"
    type: expense
    from: checking
    category: housing
    schedule:
      monthly: 1
      weekend_rule: before
    amount: {fixed: 1950.0}
    annual_escalation_rate: 0.035    # 3.5% expected lease renewal bump

  - name: "Renter Insurance"
    type: expense
    from: credit_card
    category: housing
    schedule: {monthly: 10}
    amount: {fixed: 22.0}

  # --- Utilities ---
  - name: "Electric Utility"
    type: expense
    from: credit_card
    category: utilities
    schedule: {monthly: 16}
    amount: {normal: [85.0, 15.0]}
    seasonality:
      summer: 1.45                   # Higher A/C cost in Jun, Jul, Aug
      winter: 1.20

  - name: "Gas Utility"
    type: expense
    from: credit_card
    category: utilities
    schedule: {monthly: 20}
    amount: {normal: [45.0, 10.0]}
    seasonality:
      winter: 1.80                   # Heating during Dec, Jan, Feb
      summer: 0.60

  - name: "Fiber Internet"
    type: expense
    from: credit_card
    category: utilities
    schedule: {monthly: 14}
    amount: {fixed: 75.0}

  - name: "Mobile Phone"
    type: expense
    from: credit_card
    category: utilities
    schedule: {monthly: 18}
    amount: {fixed: 65.0}

  # --- Food & Dining ---
  - name: "Weekly Groceries"
    type: expense
    from: credit_card
    category: groceries
    schedule: {weekly: sat}
    amount:
      grocery_estimate:
        people: 1
        cost_per_person_per_period: 110.0

  - name: "Weekend Dining & Takeout"
    type: expense
    from: credit_card
    category: dining
    schedule:
      random_per_week: 2.0
      weekday_weights: {fri: 2.5, sat: 3.0, sun: 1.5}
    amount: {lognormal_dollars: [45.0, 0.35], min_amount: 15.0, max_amount: 120.0}

  - name: "Coffee Shop Runs"
    type: expense
    from: credit_card
    category: food
    schedule:
      daily_prob: 0.60
      weekdays_only: true
    amount: {uniform: [5.50, 7.50]}

  # --- Transportation ---
  - name: "Gasoline"
    type: expense
    from: credit_card
    category: transport
    schedule: {weekly: sun}
    amount:
      gas_estimate:
        mpg: 29.0
        cost_per_gallon: 3.75
        miles_per_period: 180.0

  - name: "Auto Insurance"
    type: expense
    from: credit_card
    category: transport
    schedule: {every_n_months: {n: 6, day: 15}}
    amount: {fixed: 650.0}

  - name: "Routine Vehicle Maintenance"
    type: expense
    from: credit_card
    category: transport
    schedule: {every_n_months: {n: 6, day: 22}}
    amount: {fixed: 120.0}

  # --- Subscriptions & Digital Life ---
  - name: "Streaming Entertainment Bundle"
    type: expense
    from: credit_card
    category: subscriptions
    schedule: {monthly: 8}
    amount: {fixed: 38.0}
    tags: [subscription, entertainment]

  - name: "Gym Membership"
    type: expense
    from: credit_card
    category: health
    schedule: {monthly: 3}
    amount: {fixed: 75.0}
    tags: [health, fitness]

  # --- Lifestyle & Personal Care ---
  - name: "Haircut & Personal Care"
    type: expense
    from: credit_card
    category: lifestyle
    schedule: {every_n_days: 35, anchor: 2026-01-10}
    amount: {fixed: 55.0}

  - name: "Household Goods & Shopping"
    type: expense
    from: credit_card
    category: lifestyle
    schedule: {monthly: 15}
    amount: {triangular: [75.0, 140.0, 260.0]}

  - name: "Holiday Gifts"
    type: expense
    from: credit_card
    category: gifts
    schedule: {yearly: {month: 12, day: 12}}
    amount: {fixed: 600.0}

  - name: "Summer Vacation Trip"
    type: expense
    from: checking
    category: travel
    schedule:
      date_range:
        start: 2026-07-10
        end: 2026-07-17
        mode: spread_evenly
    amount: {fixed: 1600.0}

# ------------------------------------------------------------------------------
# 5. AUTOMATED CASHFLOW POLICIES
# ------------------------------------------------------------------------------
policies:
  # 1. Overdraft Shortfall Cover: automatically pull cash from HYSA if checking is low
  - name: "Checking Overdraft Protection"
    kind: shortfall_cover
    priority: 10
    to_account: checking
    from_accounts: [hysa]
    minimum_balance: 500.0

  # 2. Payday Skim: auto-invest $500 into Roth IRA on every payday (overflows to brokerage if IRA is maxed)
  - name: "Roth IRA Payday Sweep"
    kind: payday_skim
    priority: 20
    trigger_tag: payday
    from_account: checking
    to_account: roth_ira
    fixed_amount: 500.0
    respect_annual_limit: true
    overflow_to_account: brokerage

  # 3. Emergency Fund Target: ensure HYSA holds at least 6 months of living expenses
  - name: "Maintain 6-Month Emergency Fund"
    kind: emergency_fund_target
    priority: 30
    schedule: {monthly: 1}
    from_account: checking
    to_account: hysa
    keep_checking_buffer: 2500.0
    target_months_expenses: 6.0

  # 4. Month-End Sweep: sweep any idle checking cash above $4,500 into taxable brokerage
  - name: "Month-End Brokerage Sweep"
    kind: excess_sweep
    priority: 40
    schedule: {monthly: "last"}
    from_account: checking
    threshold: 4500.0
    keep_buffer: 3000.0
    allocations:
      - to_account: brokerage
        weight: 1.0

# ------------------------------------------------------------------------------
# 6. LIFE EVENTS & PROMOTIONS
# ------------------------------------------------------------------------------
events:
  # Promotion milestone after 2 years
  - name: "Senior Role Promotion"
    date: 2028-04-01
    one_time_flow:
      name: "Promotion Sign-On Equity Grant"
      type: income
      to_account: brokerage
      amount: {fixed: 5000.0}

  # Minor emergency shock (car repair or dental outlay)
  - name: "Unexpected Vehicle Repair"
    enabled: true
    poisson_per_year: 0.40
    category: transport
    type: expense
    account: checking
    amount: {lognormal_dollars: [450.0, 0.40], min_amount: 150.0, max_amount: 1200.0}
    cooldown_days: 90

# ------------------------------------------------------------------------------
# 7. TAXES & MACROECONOMICS
# ------------------------------------------------------------------------------
taxes:
  enabled: true
  filing_status: single
  state_flat_rate: 0.045
  april_true_up: true
  settlement_account: checking

inflation:
  rate: 0.025               # 2.5% annual baseline inflation
  index_irs_limits: true    # Automatically scale 401(k) and IRA limits

# ------------------------------------------------------------------------------
# 8. FINANCIAL GOALS & MILESTONES
# ------------------------------------------------------------------------------
goals:
  # Goal 1: Completely pay off student debt
  - name: "Debt Free (Student Loan Paid)"
    kind: debt_free

  # Goal 2: Reach $150k Net Worth Milestone
  - name: "$150k Net Worth"
    kind: net_worth
    target_amount: 150000.0

  # Goal 3: Reach $250k Net Worth Milestone
  - name: "$250k Net Worth"
    kind: net_worth
    target_amount: 250000.0

  # Goal 4: Reach Coast FIRE status (at age 30 with 25 years to age 55 retirement)
  - name: "Coast FIRE"
    kind: coast_fire
    retirement_age_years_away: 25.0
    real_return_assumption: 0.05
    swr: 0.04
